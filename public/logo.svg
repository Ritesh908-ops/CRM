<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" fill="none">
  <!-- Upward Arrow / K Mark -->
  <g>
    <!-- Lower swoosh curve -->
    <path d="M28 72 C28 72, 45 55, 58 48 C71 41, 78 42, 85 38" stroke="#1B3A6B" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Main rising arrow line -->
    <path d="M22 78 L52 42 L68 56 L98 18" stroke="#1B3A6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Arrow head -->
    <polygon points="98,18 88,20 94,28" fill="#1B3A6B"/>
    <polygon points="98,18 84,22 90,30 98,18" fill="#1B3A6B"/>
  </g>

  <!-- Calculator Icon -->
  <g transform="translate(62, 22)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#4CAF50"/>
    <line x1="5" y1="5" x2="9" y2="5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="7" y1="3" x2="7" y2="7" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="13" y1="5" x2="17" y2="5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="15" y1="3" x2="15" y2="7" stroke="white" stroke-width="0.5"/>
    <text x="7" y="15" font-size="7" fill="white" font-weight="bold" text-anchor="middle" font-family="Arial">=</text>
    <line x1="13" y1="14" x2="17" y2="14" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <text x="7" y="20" font-size="6" fill="white" font-weight="bold" text-anchor="middle" font-family="Arial">×</text>
  </g>

  <!-- Text: "Khata" in dark blue -->
  <text x="18" y="92" font-family="'Segoe UI', 'Arial', sans-serif" font-size="46" font-weight="800" fill="#1B3A6B" letter-spacing="-1">Khata</text>

  <!-- Text: "view" in green -->
  <text x="178" y="92" font-family="'Segoe UI', 'Arial', sans-serif" font-size="46" font-weight="800" fill="#4CAF50" letter-spacing="-1">view</text>

  <!-- Checkmark on the "w" -->
  <path d="M290 68 L298 80 L314 58" stroke="#4CAF50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
